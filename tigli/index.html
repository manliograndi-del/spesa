<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Condominio dei Tigli</title>
<meta name="robots" content="noindex, nofollow">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bitter:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: barra demo in cima, presentazione iniziale a una colonna, poi testata con targa e schede; contenuto max 920px. */
:root {
  --bg: #F2F4F1;
  --surface: #FFFFFF;
  --ink: #1A2725;
  --muted: #5B6966;
  --line: #D6DDD9;
  --soft: #E5ECE8;
  --brand: #1E5A50;
  --brand-ink: #FFFFFF;
  --brass: #9C6F24;
  --paper: #FBFBF8;
  --demo: #2B2F45;
  --demo-ink: #F4F2FF;
  --t-conv: #1E5A50;
  --t-ord: #2C5F8A;
  --t-risc: #A9481B;
  --t-verb: #64558F;
  --t-altro: #66716E;
  --fav: #2B7A4B;
  --contr: #AE3535;
  --ns: #8A8F8D;
  --warn: #9A6300;
  --f-display: "Bitter", Georgia, "Times New Roman", serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111816; --surface: #19211F; --ink: #E4EBE8; --muted: #9AA9A5; --line: #2C3835; --soft: #1F2C29;
    --brand: #62B5A5; --brand-ink: #0C1412; --brass: #D4A658; --paper: #161D1B; --demo: #2A2D44; --demo-ink: #ECEAFF;
    --t-conv: #62B5A5; --t-ord: #7FB0DE; --t-risc: #F0905F; --t-verb: #AC9EE0; --t-altro: #A3ADAA;
    --fav: #6CC891; --contr: #EF7F7F; --ns: #8E9895; --warn: #E2AE4F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111816; --surface: #19211F; --ink: #E4EBE8; --muted: #9AA9A5; --line: #2C3835; --soft: #1F2C29;
  --brand: #62B5A5; --brand-ink: #0C1412; --brass: #D4A658; --paper: #161D1B; --demo: #2A2D44; --demo-ink: #ECEAFF;
  --t-conv: #62B5A5; --t-ord: #7FB0DE; --t-risc: #F0905F; --t-verb: #AC9EE0; --t-altro: #A3ADAA;
  --fav: #6CC891; --contr: #EF7F7F; --ns: #8E9895; --warn: #E2AE4F;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--demo); }
a { color: var(--brand); }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: 1.7rem; } h2 { font-size: 1.28rem; } h3 { font-size: 1.06rem; }
p { margin: 0; }
.muted { color: var(--muted); } .small { font-size: .88rem; }
:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; border-radius: 4px; }
.in { max-width: 920px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Barra demo */
.demo { background: var(--demo); color: var(--demo-ink); font-size: .9rem; }
.demo .in { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-block: 9px; }
.demo-tag { font-family: var(--f-mono); font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; border: 1px solid currentColor; border-radius: 3px; padding: 1px 6px; }
.seg { display: inline-flex; flex-wrap: wrap; background: color-mix(in srgb, var(--demo-ink) 14%, transparent); border-radius: 18px; padding: 3px; }
.seg button { font: inherit; font-weight: 700; font-size: .86rem; border: 0; border-radius: 999px; padding: 6px 12px; background: none; color: var(--demo-ink); cursor: pointer; }
.seg button.on { background: var(--demo-ink); color: var(--demo); }
.demo .tool { font: inherit; font-size: .85rem; background: none; color: var(--demo-ink); border: 1px solid color-mix(in srgb, var(--demo-ink) 45%, transparent); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.demo .grow { flex: 1; }
.demo .home-btn { font: inherit; font-weight: 700; font-size: .92rem; background: var(--brass); color: var(--demo); border: 0; border-radius: 999px; padding: 7px 16px; cursor: pointer; box-shadow: 0 0 0 2px color-mix(in srgb, var(--brass) 40%, transparent); }
.demo .home-btn:hover { filter: brightness(1.08); }

/* Presentazione */
.intro { padding-block: 28px 64px; }
.intro-card { max-width: 640px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 18px; }
.intro-card h1 { font-size: 1.9rem; }
.intro-lead { font-size: 1.08rem; }
.intro ul { margin: 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: 6px; }
.intro-box { background: var(--soft); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.intro-box h2 { font-size: 1rem; font-family: var(--f-body); font-weight: 700; }
.intro-box dl { margin: 0; display: flex; flex-direction: column; gap: 2px; }
.intro-box dt { font-weight: 700; }
.intro-box dd { margin: 0 0 8px; min-width: 0; }
.intro-box dd:last-child { margin-bottom: 0; }
.intro-btns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.intro-btns .btn { border-radius: 22px; padding: 9px 6px; font-size: clamp(11px, 3vw, 16px); line-height: 1.25; flex-direction: column; justify-content: center; gap: 0; text-align: center; }
.intro-btns .btn span { display: block; white-space: nowrap; }

/* Testata */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 16px; padding-block: 12px 2px; }
.brand { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; min-width: 0; }
.brand-name { font-family: var(--f-display); font-weight: 700; font-size: 1.22rem; color: var(--ink); text-decoration: none; }
.targa { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--brass); border: 1px solid currentColor; border-radius: 3px; padding: 1px 7px; }
.who { font-size: .9rem; color: var(--muted); }
.who b { color: var(--ink); }
.nav { overflow-x: auto; scrollbar-width: none; }
.nav .in { display: flex; gap: 2px; }
.nav a { flex: none; padding: 10px 12px 9px; color: var(--muted); text-decoration: none; font-weight: 700; font-size: .95rem; border-bottom: 3px solid transparent; display: inline-flex; gap: 6px; align-items: center; }
.nav a:hover { color: var(--ink); }
.nav a.on { color: var(--ink); border-bottom-color: var(--brand); }
.count { background: var(--contr); color: var(--surface); font-size: .74rem; border-radius: 999px; padding: 0 7px; line-height: 1.5; }

main.in { padding-block: 22px 72px; display: flex; flex-direction: column; gap: 26px; }
section { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.crumbs { font-size: .9rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; }
.crumbs a { color: var(--muted); }

.chip { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 700; letter-spacing: .02em; padding: 2px 9px; border-radius: 999px; white-space: nowrap; color: var(--c, var(--t-altro)); background: color-mix(in srgb, var(--c, var(--t-altro)) 13%, transparent); }
.t-convocazione { --c: var(--t-conv); } .t-ordinarie { --c: var(--t-ord); } .t-riscaldamento { --c: var(--t-risc); } .t-verbale { --c: var(--t-verb); } .t-altro { --c: var(--t-altro); }
.c-ok { --c: var(--fav); } .c-wait { --c: var(--warn); } .c-new { --c: var(--brass); }

.btn { font: inherit; font-weight: 700; font-size: .95rem; border-radius: 8px; padding: 9px 16px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.quiet { border-color: transparent; background: none; color: var(--brand); padding-inline: 6px; }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.filters button { flex: none; font: inherit; font-size: .9rem; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.filters button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

label { font-weight: 700; font-size: .92rem; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
label.check { flex-direction: row; align-items: center; gap: 8px; font-weight: 400; }
input[type=text], select, textarea { font: inherit; font-weight: 400; font-size: 1rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%; min-width: 0; }
textarea { min-height: 96px; resize: vertical; }
.form { display: flex; flex-direction: column; gap: 12px; }

.list { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.item { display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; padding: 13px 2px; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; align-items: start; }
a.item:hover .item-title { text-decoration: underline; }
.item-title { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.item-meta { font-size: .88rem; color: var(--muted); display: flex; gap: 6px 12px; flex-wrap: wrap; align-items: center; grid-column: 1 / -1; }
.item-side { font-size: .85rem; color: var(--muted); text-align: right; white-space: nowrap; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.note { font-size: .92rem; color: var(--muted); background: var(--soft); border-radius: 8px; padding: 10px 14px; }
.note b { color: var(--ink); }
.empty { border: 1px dashed var(--line); border-radius: 12px; padding: 20px; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20; background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 10px; font-weight: 700; max-width: min(560px, calc(100vw - 32px)); box-shadow: 0 6px 24px rgb(0 0 0 / .22); }

/* Allegati */
.files { display: flex; flex-direction: column; gap: 6px; }
.file { font: inherit; display: flex; align-items: center; gap: 10px; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 9px 12px; cursor: pointer; min-width: 0; }
.file:hover { border-color: var(--muted); }
.file-ico { flex: none; font-family: var(--f-mono); font-size: .68rem; font-weight: 500; letter-spacing: .05em; color: var(--t-risc); border: 1px solid currentColor; border-radius: 3px; padding: 1px 4px; }
.file-name { min-width: 0; overflow-wrap: anywhere; font-weight: 700; font-size: .94rem; }
.file-from { margin-left: auto; flex: none; font-size: .8rem; color: var(--muted); }

/* Assemblea */
.next { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: start; }
.cal { width: 84px; text-align: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--paper); }
.cal-m { background: var(--brand); color: var(--brand-ink); font-size: .74rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 3px 0; }
.cal-d { font-family: var(--f-display); font-size: 2.1rem; font-weight: 700; line-height: 1.15; padding-top: 4px; }
.cal-w { font-size: .76rem; color: var(--muted); padding-bottom: 6px; }
.conv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: .95rem; margin: 0; }
.conv dt { font-family: var(--f-mono); font-size: .8rem; color: var(--muted); padding-top: 2px; }
.conv dd { margin: 0; min-width: 0; }
.odg { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.odg li { border-bottom: 1px solid var(--line); }
.odg a { display: grid; grid-template-columns: 2.2rem 1fr; gap: 4px 8px; padding: 13px 2px; color: inherit; text-decoration: none; align-items: baseline; }
.odg a:hover .odg-t { text-decoration: underline; }
.odg-n { font-family: var(--f-display); font-weight: 700; color: var(--brass); font-size: 1.1rem; }
.odg-t { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.odg-d { grid-column: 2; font-size: .88rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }

/* Lettera */
.letter { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.letter-head { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: .9rem; padding-bottom: 12px; border-bottom: 1px solid var(--line); margin: 0; }
.letter-head dt { color: var(--muted); } .letter-head dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.letter-body { display: flex; flex-direction: column; gap: 12px; max-width: 70ch; }
.summary { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.summary ol { margin: 0; padding-left: 1.4rem; display: flex; flex-direction: column; gap: 4px; }
.label { font-size: .76rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

/* Condivisioni, bacheca e sondaggi */
.share { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.share-head { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; font-size: .9rem; color: var(--muted); }
.share-head b { color: var(--ink); }
.share-text { overflow-wrap: anywhere; max-width: 68ch; }
.poll { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.poll-q { font-weight: 700; }
.bars { display: flex; flex-direction: column; gap: 6px; }
.bar { display: grid; grid-template-columns: 7.5rem 1fr 4.6rem; gap: 10px; align-items: center; font-size: .92rem; }
.bar-track { height: 12px; background: var(--soft); border-radius: 6px; overflow: hidden; }
.bar-fill { display: block; height: 100%; border-radius: 6px; background: var(--c); }
.bar .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.v-fav { --c: var(--fav); } .v-contr { --c: var(--contr); } .v-ns { --c: var(--ns); }
.votes { display: flex; flex-wrap: wrap; gap: 8px; }
.vote { font: inherit; font-weight: 700; padding: 9px 16px; border-radius: 8px; border: 2px solid var(--c); color: var(--c); background: var(--surface); cursor: pointer; }
.vote.on { background: var(--c); color: var(--surface); }
.vote.mini { padding: 5px 12px; font-size: .9rem; }
.vote .n { font-variant-numeric: tabular-nums; margin-left: 6px; opacity: .85; }
.status { display: flex; flex-wrap: wrap; gap: 6px 10px; font-size: .88rem; color: var(--muted); align-items: center; }

.obs { padding: 16px 2px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.obs-head { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; font-size: .9rem; color: var(--muted); }
.obs-head b { color: var(--ink); font-size: 1rem; }
.obs-text { overflow-wrap: anywhere; max-width: 68ch; }
.prep { background: var(--soft); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.prep textarea { min-height: 220px; font-size: .94rem; }

@media (max-width: 560px) {
  h1 { font-size: 1.42rem; }
  .intro-card { padding: 20px 14px; }
  .intro-card h1 { font-size: 1.55rem; }
  .next { grid-template-columns: 1fr; }
  .cal { display: none; }
  .panel, .letter { padding: 16px; }
  .bar { grid-template-columns: 6.2rem 1fr 4.2rem; }
  .file-from { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="app"></div>

<script>
"use strict";
/* ---------- dati inventati ---------- */
const OGGI = "2026-10-28";
const NOME = "Condominio dei Tigli";
const AMM = "Studio Amministrazioni Ferraris";
const AMM_MAIL = "studio@ferraris-amministrazioni.example";
const IO = { scala: "Scala 1", interno: "7" };
const RAPP = { "Scala 1": "Renzo", "Scala 2": "Lucia" };
const TIPI = { convocazione: "Convocazione", ordinarie: "Spese ordinarie", riscaldamento: "Riscaldamento", verbale: "Verbale", altro: "Altro" };
const MESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const parseD = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const fmtD = (s, o = { day: "numeric", month: "long", year: "numeric" }) => new Intl.DateTimeFormat("it-IT", o).format(parseD(s));
const fmtS = (s) => fmtD(s, { day: "numeric", month: "short" });
const fmtL = (s) => fmtD(s, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
const gest = (d) => { const dt = parseD(d), y = dt.getFullYear(); return dt.getMonth() + 1 >= 10 ? `${y}/${y + 1}` : `${y - 1}/${y}`; };
const giorni = (d) => Math.round((parseD(d) - parseD(OGGI)) / 86400000);
const P = (...t) => t.map((x) => `<p>${x}</p>`).join("");
const SALUTI = P("Distinti saluti.", `<i>${AMM}</i>`);

const DOCS = [
  { id: "d01", data: "2025-10-06", tipo: "ordinarie", titolo: "Piano rate della gestione ordinaria 2025/2026",
    testo: P("Gentili Condomini,", "si trasmette in allegato il piano rate proposto per la gestione ordinaria 2025/2026, che sarà sottoposto all'approvazione dell'assemblea. La prima rata, in scadenza il 31 ottobre, è in acconto.") + SALUTI,
    allegati: ["Piano_rate_gestione_2025-2026.pdf"] },
  { id: "d02", data: "2025-10-13", tipo: "riscaldamento", titolo: "Avvio della stagione di riscaldamento 2025/2026",
    testo: P("Gentili Condomini,", "l'impianto centralizzato sarà acceso il 15 ottobre 2025 e resterà in funzione fino al 15 aprile 2026. In allegato le scadenze degli acconti della stagione.", "Si ricorda di non coprire i ripartitori di calore installati sui termosifoni.") + SALUTI,
    allegati: ["Acconti_riscaldamento_2025-2026.pdf"] },
  { id: "d03", data: "2025-11-03", tipo: "convocazione", ass: "a1", titolo: "Convocazione dell'assemblea ordinaria del 27 novembre 2025",
    testo: P("Gentili Condomini,", "si trasmette in allegato la convocazione dell'assemblea ordinaria, con i documenti relativi ai punti all'ordine del giorno.") + SALUTI,
    allegati: ["Convocazione_assemblea_27-11-2025.pdf", "Rendiconto_gestione_2024-2025.pdf", "Preventivo_gestione_2025-2026.pdf", "Modulo_delega.pdf"] },
  { id: "d04", data: "2025-12-10", tipo: "verbale", ass: "a1", titolo: "Verbale dell'assemblea ordinaria del 27 novembre 2025",
    testo: P("Gentili Condomini,", "si trasmette in allegato il verbale dell'assemblea ordinaria del 27 novembre 2025.") + SALUTI,
    allegati: ["Verbale_assemblea_27-11-2025.pdf"] },
  { id: "d05", data: "2026-03-02", tipo: "convocazione", ass: "a2", titolo: "Convocazione dell'assemblea straordinaria del 26 marzo 2026",
    testo: P("Gentili Condomini,", "si trasmette in allegato la convocazione dell'assemblea straordinaria.") + SALUTI,
    allegati: ["Convocazione_assemblea_26-03-2026.pdf", "Modulo_delega.pdf"] },
  { id: "d06", data: "2026-04-08", tipo: "verbale", ass: "a2", titolo: "Verbale dell'assemblea straordinaria del 26 marzo 2026",
    testo: P("Gentili Condomini,", "si trasmette in allegato il verbale dell'assemblea straordinaria del 26 marzo 2026.") + SALUTI,

/* ---------- routing e render ---------- */
function route() {
  const h = location.hash.slice(1); let m;
  if ((m = h.match(/^doc-(d\d+)$/))) return { name: "doc", id: m[1] };
  if ((m = h.match(/^ass-(a\d+)$/))) return { name: "ass", id: m[1] };
  if ((m = h.match(/^punto-(a\d+)-(\d+)$/))) return { name: "punto", id: m[1], n: +m[2] };
  return { name: ["documenti", "assemblee", "osservazioni", "bacheca"].includes(h) ? h : "home" };
}
function render() {
  const saved = {};
  document.querySelectorAll("#app input[id], #app textarea[id], #app select[id]").forEach((el) => { if (el.type !== "file") saved[el.id] = el.type === "checkbox" ? el.checked : el.value; });
  const act = document.activeElement?.id;
  document.getElementById("app").innerHTML = demoBar() + (UI.modo ? header() + `<main class="in">${view()}</main>` : intro()) + (UI.toast ? `<div class="toast" role="status">${esc(UI.toast)}</div>` : "");
  for (const [id, v] of Object.entries(saved)) { const el = document.getElementById(id); if (el) { if (el.type === "checkbox") el.checked = v; else el.value = v; } }
  if (act) document.getElementById(act)?.focus({ preventScroll: true });
}

  const modi = [["inquilino", "Inquilino"], ["rappresentante", "Rappresentante"], ["auto", "Versione automatica"]];

function header() {

function view() {
  const r = route();
  if (r.name === "doc") return viewDoc(r.id);

  copia: async (d) => {
    const id = `prep-${d.id}-${d.v}`;
    try { await navigator.clipboard.writeText(val(id)); toast("Testo copiato: puoi incollarlo nella tua email."); }
    catch { document.getElementById(id)?.select(); toast("Testo selezionato: copialo con Ctrl+C o tenendo premuto."); }
  },
  invia: (d) => {
    const c = D.cond.find((x) => x.id === d.id);
    if (d.v === "amm") c.inoltrata = OGGI; else c.email = OGGI;
    UI.prep = null;
    toast(d.v === "amm" ? "Inviata all'amministratore (nella demo non parte nessuna email)." : "Inviata a tutti gli inquilini (nella demo non parte nessuna email).");
  },
  "share-apri": (d) => { UI.sharing = d.id; render(); },
  "share-chiudi": () => { UI.sharing = null; render(); },
  archivia: (d) => { D.oss.find((o) => o.id === d.id).stato = "archiviata"; toast("Lasciata da parte. L'inquilino vede che l'hai letta."); },
  ripristina: (d) => { D.oss.find((o) => o.id === d.id).stato = "nuova"; UI.tab = "nuove"; render(); },
  condividi: (d) => {
    const o = D.oss.find((x) => x.id === d.id);
    const testo = val("sh-t-" + o.id).trim() || o.testo;
    const conPoll = document.getElementById("sh-p-" + o.id)?.checked;
    const q = val("sh-q-" + o.id).trim() || "Siete d'accordo con questa proposta?";
    const c = { id: newId("c"), ass: o.ass, n: o.n, scala: o.scala, data: OGGI, testo, allegato: o.allegato, poll: conPoll ? { q, v: { fav: 0, contr: 0, ns: 0 }, aperto: true, mio: null } : null, inoltrata: null, email: null };
    D.cond.push(c); o.stato = "condivisa"; o.cond = c.id; UI.sharing = null;
    toast(conPoll ? "Condivisa con tutti, con il sondaggio aperto." : "Condivisa con tutti.");
  },
  oss: (d) => {
    const key = d.v || "x";
    const n = d.v ? +d.v : +val("os-pt-" + key);
    const testo = val("os-t-" + key).trim();
    if (!testo) return toast("Scrivi il testo prima di inviarlo.");
    const f = document.getElementById("os-f-" + key)?.files?.[0];
    const base = { id: newId("o"), scala: IO.scala, interno: IO.interno, data: OGGI, n, testo, allegato: f ? f.name : "" };
    document.getElementById("os-t-" + key).value = "";
    if (isAuto()) { D.bacheca.push({ ...base, v: { fav: 0, contr: 0, ns: 0 }, mio: null }); toast("Pubblicato in bacheca: lo vedono subito tutti."); }
    else { D.oss.push({ ...base, ass: NEXT, stato: "nuova" }); toast(`Inviata a ${RAPP[IO.scala]}. Passa alla vista Rappresentante per vederla arrivare.`); }
  },
};
document.addEventListener("click", (e) => { const b = e.target.closest("[data-act]"); if (!b) return; e.preventDefault(); ACT[b.dataset.act]?.(b.dataset, b); });
window.addEventListener("hashchange", () => { UI.sharing = null; UI.prep = null; render(); window.scrollTo(0, 0); });
render();
</script>

</body></html>
