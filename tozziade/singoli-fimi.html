<style>
/* Layout: one broadcast "stage" panel — fixed rank rail, song column, bar track — with the year watermark dropping in behind the bars; transport controls and a format timeline underneath. */
:root {
  --bg: #f2f4f7;
  --panel: #ffffff;
  --fg: #13161b;
  --fg2: #4a5260;
  --fg3: #7a8291;
  --line: #e1e5ec;
  --track: #eef1f5;
  --it: #eb6834;
  --int: #2a78d6;
  --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --row: 50px;
  --label: 250px;
  --rail: 34px;
  --valroom: 80px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1014; --panel: #171a20; --fg: #eef0f4; --fg2: #b3b9c4; --fg3: #7f8796;
    --line: #2a2f38; --track: #1f232a; --it: #d95926; --int: #3987e5; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1014; --panel: #171a20; --fg: #eef0f4; --fg2: #b3b9c4; --fg3: #7f8796;
  --line: #2a2f38; --track: #1f232a; --it: #d95926; --int: #3987e5; color-scheme: dark;
}
@media (max-width: 680px) {
  :root { --row: 52px; --label: 0px; --rail: 22px; --valroom: 60px; }
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 40px;
}
#app { max-width: 1120px; margin: 0 auto; display: grid; gap: 18px; }

.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.head-text { min-width: 0; display: grid; gap: 4px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--fg3); }
h1 { margin: 0; font-family: var(--display); font-weight: 900; font-size: clamp(40px, 7vw, 68px); line-height: .9; letter-spacing: .005em; text-transform: uppercase; text-wrap: balance; }
.lede { margin: 6px 0 0; color: var(--fg2); max-width: 62ch; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--fg2); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.sw { width: 14px; height: 10px; border-radius: 0 3px 3px 0; display: inline-block; flex: none; }
.sw.it { background: var(--it); } .sw.int { background: var(--int); }

.stage {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px 16px 18px;
  overflow: hidden;
  isolation: isolate;
}
.stage-top { position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
.stage-title { font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--fg3); }
.leader { font-size: 13px; color: var(--fg2); min-width: 0; }
.leader b { color: var(--fg); font-weight: 600; }

.wm-wrap { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
.wm {
  position: absolute; left: 50%; top: 56%;
  font-family: var(--display); font-weight: 900;
  font-size: clamp(150px, 31vw, 400px); line-height: .8;
  letter-spacing: -.01em; color: var(--fg);
  font-variant-numeric: tabular-nums;
  opacity: .1;
  transform: translate(-50%, -50%) scale(1);
  transform-origin: 50% 50%;
  animation: yearDrop 1050ms cubic-bezier(.2, .85, .25, 1) both;
  white-space: nowrap;
}
@keyframes yearDrop {
  0%   { transform: translate(-50%, -260%) scale(4.6); opacity: 0; }
  10%  { opacity: .5; }
  40%  { transform: translate(-50%, -50%) scale(.84); opacity: .24; }
  62%  { transform: translate(-50%, -50%) scale(1.045); opacity: .14; }
  100% { transform: translate(-50%, -50%) scale(1); opacity: .1; }
}

.cols { display: grid; grid-template-columns: var(--rail) var(--label) minmax(0, 1fr); }
.plotin { position: relative; height: 100%; margin-right: var(--valroom); }

.axis { position: relative; z-index: 1; height: 22px; }
.axis .tick { position: absolute; bottom: 4px; transform: translateX(-50%); font-size: 11px; color: var(--fg3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.axis .tick:first-child { transform: none; }

.rows { position: relative; z-index: 1; height: calc(var(--row) * 10); }
.gridlayer { position: absolute; inset: 0; pointer-events: none; }
.gridlayer .gl { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
.ranks { display: grid; grid-template-rows: repeat(10, var(--row)); }
.ranks span { display: flex; align-items: center; font-family: var(--display); font-weight: 800; font-size: 20px; color: var(--fg3); font-variant-numeric: tabular-nums; }

.row {
  position: absolute; left: 0; right: 0; top: 0;
  height: var(--row);
  transition: transform 1100ms cubic-bezier(.45, 0, .2, 1), opacity 700ms ease;
  will-change: transform;
  outline: none;
}
.row.off { opacity: 0; pointer-events: none; }
.label { display: flex; flex-direction: column; justify-content: center; min-width: 0; padding-right: 12px; }
.name { font-weight: 600; font-size: 15px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub { font-size: 11.5px; color: var(--fg3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
.bar {
  position: absolute; left: 0; top: 50%;
  height: 62%; transform: translateY(-50%);
  border-radius: 0 4px 4px 0;
  transition: width 500ms linear;
}
.bar.it { background: var(--it); }
.bar.int { background: var(--int); }
.bar.over { border-radius: 0; background-image: linear-gradient(90deg, transparent calc(100% - 9px), var(--panel) calc(100% - 9px), var(--panel) calc(100% - 6px), transparent calc(100% - 6px)); }
.val {
  position: absolute; top: 50%; transform: translateY(-50%);
  padding-left: 8px; font-size: 13px; font-weight: 600; color: var(--fg2);
  font-variant-numeric: tabular-nums; white-space: nowrap;
  transition: left 500ms linear;
}
.row:hover .bar, .row:focus-visible .bar { filter: brightness(1.08); }
.row:focus-visible .name { text-decoration: underline; text-underline-offset: 3px; }

.tip {
  position: absolute; z-index: 5; left: calc(var(--rail) + var(--label) - 4px); top: calc(100% - 4px);
  background: var(--panel); color: var(--fg); border: 1px solid var(--line);
  box-shadow: 0 8px 24px rgb(0 0 0 / .14);
  border-radius: 10px; padding: 10px 12px; font-size: 13px; min-width: 210px; max-width: min(340px, 80vw);
  display: none; pointer-events: none;
}
.row:hover .tip, .row:focus .tip { display: grid; gap: 2px; }
.row.low .tip { top: auto; bottom: calc(100% - 4px); }
.tip .t-name { font-weight: 700; display: flex; align-items: center; gap: 8px; }
.tip .t-val { font-variant-numeric: tabular-nums; }
.tip .t-muted { color: var(--fg3); font-size: 12px; }

.controls { display: grid; gap: 10px; }
.transport { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--fg);
  font: 600 14px/1 var(--body); height: 40px; padding: 0 16px; border-radius: 999px;
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
}
.btn:hover { border-color: var(--fg3); }
.btn:focus-visible, .scrub:focus-visible { outline: 2px solid var(--int); outline-offset: 2px; }
.btn.primary { background: var(--fg); color: var(--panel); border-color: var(--fg); min-width: 116px; justify-content: center; }
.btn svg { width: 14px; height: 14px; fill: currentColor; }
.readout { margin-left: auto; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.readout .when { font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: .02em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
.era-chip { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--fg2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }

.timeline { position: relative; display: grid; gap: 6px; }
.scrub { width: 100%; margin: 0; accent-color: var(--fg); cursor: pointer; }
.eras { display: flex; height: 22px; border-radius: 6px; overflow: hidden; gap: 2px; }
.eras div { min-width: 0; background: var(--track); color: var(--fg3); font-size: 11px; font-weight: 600; letter-spacing: .04em; display: flex; align-items: center; padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background .3s, color .3s; }
.eras div.on { background: var(--fg); color: var(--panel); }
.eras .short { display: none; }
.decades { position: relative; height: 16px; font-size: 11px; color: var(--fg3); font-variant-numeric: tabular-nums; }
.decades span { position: absolute; transform: translateX(-50%); }
.decades span:first-child { transform: none; }
.decades span:last-child { transform: translateX(-100%); }

details { border-top: 1px solid var(--line); padding-top: 12px; }
summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--fg2); }
.tbl-wrap { overflow-x: auto; margin-top: 10px; }
table { border-collapse: collapse; width: 100%; max-width: 760px; font-size: 13.5px; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
th { color: var(--fg3); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }

.note { color: var(--fg3); font-size: 12.5px; max-width: 80ch; margin: 0; }

@media (max-width: 680px) {
  body { padding-block: 18px 32px; font-size: 14px; }
  .lede { font-size: 14px; }
  .cols { grid-template-columns: var(--rail) minmax(0, 1fr); }
  .axis > span:nth-child(2), .gridlayer > span { display: none; }
  .row.cols { grid-template-rows: 22px minmax(0, 1fr); padding-bottom: 6px; }
  .row > span:first-child { grid-row: 1 / 3; }
  .row .label { grid-column: 2; grid-row: 1; flex-direction: row; align-items: flex-end; justify-content: flex-start; gap: 6px; padding-right: 0; }
  .row .plotin { grid-column: 2; grid-row: 2; }
  .name { font-size: 13px; flex: 0 1 auto; max-width: 72%; }
  .sub { font-size: 10.5px; flex: 1 1 0; min-width: 0; }
  .bar { height: 16px; }
  .val { font-size: 11.5px; padding-left: 5px; }
  .ranks span { font-size: 16px; }
  .tip { left: var(--rail); right: 0; min-width: 0; }
  .wm { font-size: clamp(110px, 34vw, 400px); }
  .stage { padding: 12px 10px 14px; border-radius: 12px; }
  .stage-top { flex-direction: column; gap: 2px; }
  .transport { gap: 8px; }
  .btn { height: 44px; padding: 0 14px; }
  .btn.primary { flex: 1 1 auto; }
  .readout { margin-left: 0; width: 100%; justify-content: space-between; order: -1; }
  .readout .when { font-size: 24px; }
  .eras div { font-size: 10.5px; padding: 0 5px; }
  .eras .long { display: none; }
  .eras .short { display: inline; }
  .scrub { height: 28px; }
}
@media (prefers-reduced-motion: reduce) {
  .row, .bar, .val { transition: none; }
  .wm { animation: none; }
}

const Y0 = 2002, Y1 = 2025;
// Stima delle unità del n. 1 dell'anno (migliaia): dimensione del mercato dei singoli in Italia.
const MARKET = [[1970,900],[1979,900],[1983,800],[1987,700],[1989,600],[1992,350],[1995,250],[2000,180],[2005,130],[2009,110],[2012,160],[2014,250],[2017,450],[2020,550],[2023,700],[2025,800]];
function marketTop(y) {
  for (let k = 1; k < MARKET.length; k++) {
    const [ya, va] = MARKET[k - 1], [yb, vb] = MARKET[k];
    if (y <= yb) return va + (vb - va) * (y - ya) / (yb - ya);
  }
  return MARKET[MARKET.length - 1][1];
}
const rankShare = r => Math.pow(r, -0.55);   // n. 1 = 100%, n. 10 ≈ 28%

const SONGS = [];
const byKey = new Map();
const MISSING = new Set();
RAW.trim().split("\n").forEach(line => {
  const [y, r, t, ar, c] = line.split("|");
  const key = (t + "|" + ar).toLowerCase();
  let s = byKey.get(key);
  if (!s) { s = { t, ar, c, id: key, ranks: {} }; byKey.set(key, s); SONGS.push(s); }
  s.ranks[+y] = +r;
});
for (let y = Y0; y <= Y1; y++) {
  const have = new Set(SONGS.filter(s => s.ranks[y]).map(s => s.ranks[y]));
  for (let r = 1; r <= 10; r++) if (!have.has(r)) MISSING.add(`${y}|${r}`);
}

const VAL = SONGS.map(s => {
  const row = new Array(Y1 - Y0 + 2).fill(0);
  for (const y in s.ranks) row[+y - Y0] = Math.round(marketTop(+y) * rankShare(s.ranks[y])) * 1000;
  return row;
});

const FRAMES = (Y1 - Y0) * 12;         // un frame per mese
const MS_PER_FRAME = 6000 / 12;        // 6000 ms per anno → 500 ms per mese
const X_MAX = 1000000;
const X_MAX_PHONE = 1000000;
const PHONE_MQ = "(max-width: 680px)";
const VISIBLE = 10;
const MONTHS = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const ERAS = [
  { from: 2002, to: 2004, label: "CD singolo", short: "CD" },
  { from: 2004, to: 2014, label: "Download digitale", short: "Download" },
  { from: 2014, to: 2025, label: "Streaming", short: "Streaming" },
];
const TICKS_ALL = [0, 250000, 500000, 750000, 1000000];
const fmt = new Intl.NumberFormat("it-IT");
const tickLabel = v => v === 0 ? "0" : v < 1e6 ? `${v / 1000} mila` : `${fmt.format(v / 1e6)} mln`;

function frameState(f) {
  const yi = Math.floor(f / 12), m = f % 12, t = m / 12;
  const list = SONGS.map((a, i) => {
    const v0 = VAL[i][yi], v1 = VAL[i][yi + 1];
    return { i, v: v0 + (v1 - v0) * t };
  });
  const sorted = list.slice().sort((p, q) => q.v - p.v || p.i - q.i);
  const rank = new Array(SONGS.length);
  sorted.forEach((d, r) => { rank[d.i] = r; });
  return { year: Y0 + yi, month: m, list, rank, sorted };
}

const html = htm.bind(React.createElement);
const { useState, useEffect, useRef, useMemo, useCallback } = React;

const PlayIcon = () => html`<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5v11l9-5.5z"/></svg>`;
const PauseIcon = () => html`<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 1.5h3.2v11H2.5zM8.3 1.5h3.2v11H8.3z"/></svg>`;
const RestartIcon = () => html`<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.5a5.5 5.5 0 1 1-5.2 3.7l1.6.6A3.8 3.8 0 1 0 7 3.2V5L3.8 2.4 7 0z"/></svg>`;

function App() {
  const [frame, setFrame] = useState(0);
  const [playing, setPlaying] = useState(true);
  const frameRef = useRef(0);
  const [phone, setPhone] = useState(() => window.matchMedia(PHONE_MQ).matches);
  useEffect(() => {
    const mq = window.matchMedia(PHONE_MQ);
    const on = () => setPhone(mq.matches);
    mq.addEventListener("change", on);
    return () => mq.removeEventListener("change", on);
  }, []);
  const X_MAX_NOW = phone ? X_MAX_PHONE : X_MAX;
  const TICKS = TICKS_ALL.filter(t => t <= X_MAX_NOW && (!phone || t % 500000 === 0));

  useEffect(() => {
    if (!playing) return;
    let raf, t0 = performance.now() - frameRef.current * MS_PER_FRAME, last = performance.now();
    const tick = now => {
      const gap = now - last; last = now;
      if (gap > 500) t0 += gap - 16;
      const f = Math.max(0, Math.min(FRAMES, Math.floor((now - t0) / MS_PER_FRAME)));
      if (f !== frameRef.current) { frameRef.current = f; setFrame(f); }
      if (f >= FRAMES) { setPlaying(false); return; }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [playing]);

  const toggle = useCallback(() => {
    if (!playing && frameRef.current >= FRAMES) { frameRef.current = 0; setFrame(0); }
    setPlaying(p => !p);
  }, [playing]);
  const restart = () => { frameRef.current = 0; setFrame(0); setPlaying(true); };
  const scrub = e => { const f = +e.target.value; setPlaying(false); frameRef.current = f; setFrame(f); };

  useEffect(() => {
    const onKey = e => {
      if (e.code === "Space" && !["INPUT","BUTTON","SUMMARY"].includes(document.activeElement?.tagName)) { e.preventDefault(); toggle(); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [toggle]);

  const st = useMemo(() => frameState(frame), [frame]);
  const era = ERAS.find(e => st.year >= e.from && st.year < e.to) || ERAS[ERAS.length - 1];
  const leader = SONGS[st.sorted[0].i];
  const yearRows = useMemo(() => SONGS.filter(s => s.ranks[st.year]).sort((p, q) => p.ranks[st.year] - q.ranks[st.year]), [st.year]);
  const yearMissing = [...Array(10)].map((_, k) => k + 1).filter(r => MISSING.has(`${st.year}|${r}`));
  const when = `${MONTHS[st.month]} ${st.year}`;

  return html`
    <header class="head">
      <div class="head-text">
        <span class="eyebrow">Mercato discografico italiano · Singoli · 2002–2025</span>
        <h1>Singoli FIMI</h1>
        <p class="lede">Le canzoni più vendute in Italia, anno per anno, secondo le classifiche annuali ufficiali della FIMI. L'ordine è quello reale; la lunghezza delle barre è una stima delle unità vendute nell'anno.</p>
      </div>
      <div class="legend" aria-label="Legenda">
        <span><i class="sw it"></i>Artisti italiani</span>
        <span><i class="sw int"></i>Artisti internazionali</span>
      </div>
    </header>

    <section class="stage" aria-label="Classifica animata dei singoli">
      <div class="wm-wrap" aria-hidden="true"><div class="wm" key=${st.year}>${st.year}</div></div>

      <div class="stage-top">
        <span class="stage-title">Classifica annuale · unità stimate</span>
        <span class="leader">In testa: <b>${leader.t}</b> · ${leader.ar}</span>
      </div>

      <div class="axis cols" aria-hidden="true">
        <span></span><span></span>
        <div class="plotin">
          ${TICKS.map(t => html`<span class="tick" key=${t} style=${{ left: `${(t / X_MAX_NOW) * 100}%` }}>${tickLabel(t)}</span>`)}
        </div>
      </div>

      <div class="rows">
        <div class="gridlayer cols" aria-hidden="true">
          <div class="ranks">${Array.from({ length: VISIBLE }, (_, r) => html`<span key=${r}>${r + 1}</span>`)}</div>
          <span></span>
          <div class="plotin">${TICKS.map(t => html`<i class="gl" key=${t} style=${{ left: `${(t / X_MAX_NOW) * 100}%` }}></i>`)}</div>
        </div>

        ${SONGS.map((a, i) => {
          const r = st.rank[i];
          const v = st.list[i].v;
          const on = r < VISIBLE && v > 0;
          const pos = on ? r : VISIBLE;
          const pct = Math.min(100, (v / X_MAX_NOW) * 100);
          const shown = fmt.format(Math.round(v / 1000) * 1000);
          const real = a.ranks[st.year];
          return html`
            <div key=${a.id} class=${`row cols${on ? "" : " off"}${r >= 6 ? " low" : ""}`}
                 style=${{ transform: `translateY(calc(${pos} * var(--row)))` }}
                 tabindex=${on ? 0 : -1} aria-hidden=${on ? "false" : "true"}
                 aria-label=${`${a.t} di ${a.ar}${real ? `, n. ${real} nella classifica annuale ${st.year}` : ""}`}>
              <span></span>
              <div class="label">
                <span class="name">${a.t}</span>
                <span class="sub">${a.ar}</span>
              </div>
              <div class="plotin">
                <div class=${`bar ${a.c}${v > X_MAX_NOW ? " over" : ""}`} style=${{ width: `${pct}%` }}></div>
                <span class="val" style=${{ left: `${pct}%` }}>${shown}</span>
              </div>
              <div class="tip" role="tooltip">
                <span class="t-name"><i class=${`sw ${a.c}`}></i>${a.t}</span>
                <span class="t-muted">${a.ar}</span>
                <span class="t-val">${real ? `N. ${real} nella classifica annuale ${st.year}` : `Fuori dalla classifica annuale ${st.year}`}</span>
                <span class="t-muted">Anni in classifica: ${Object.keys(a.ranks).map(y => `${y} (n. ${a.ranks[y]})`).join(", ")}</span>
                <span class="t-muted">Unità stimate in questo momento: ${shown}</span>
              </div>
            </div>`;
        })}
      </div>
    </section>

    <section class="controls" aria-label="Controlli">
      <div class="transport">
        <button class="btn primary" id="play" onClick=${toggle} aria-label=${playing ? "Metti in pausa" : "Riproduci"}>
          ${playing ? html`<${PauseIcon}/>` : html`<${PlayIcon}/>`}${playing ? "Pausa" : frame >= FRAMES ? "Rivedi" : "Riproduci"}
        </button>
        <button class="btn" id="restart" onClick=${restart}><${RestartIcon}/>Dal 2002</button>
        <div class="readout">
          <span class="when">${when}</span>
          <span class="era-chip">${era.label}</span>
        </div>
      </div>
      <div class="timeline">
        <input class="scrub" id="scrub" type="range" min="0" max=${FRAMES} step="1" value=${frame}
               onInput=${scrub} onChange=${scrub}
               aria-label="Posizione nel tempo" aria-valuetext=${when} />
        <div class="eras" aria-hidden="true">
          ${ERAS.map(e => html`<div key=${e.label} class=${e === era ? "on" : ""} style=${{ flex: `${e.to - e.from} 1 0` }} title=${e.label}><span class="long">${e.label}</span><span class="short">${e.short}</span></div>`)}
        </div>
        <div class="decades" aria-hidden="true">
          ${[2002, 2005, 2010, 2015, 2020, 2025].map(y => html`<span key=${y} style=${{ left: `${((y - Y0) * 12 / FRAMES) * 100}%` }}>${y}</span>`)}
        </div>
      </div>
    </section>

    <details>
      <summary>Classifica annuale FIMI ${st.year}</summary>
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>Pos.</th><th>Canzone</th><th>Artista</th><th class="num">Unità stimate</th></tr></thead>
          <tbody>
            ${yearRows.map(s => html`<tr key=${s.id}><td>${s.ranks[st.year]}</td><td>${s.t}</td><td>${s.ar}</td><td class="num">${fmt.format(VAL[SONGS.indexOf(s)][st.year - Y0])}</td></tr>`)}
            ${yearMissing.map(r => html`<tr key=${"m" + r}><td>${r}</td><td colspan="3" class="t-muted">Posizione non leggibile dalla fonte</td></tr>`)}
          </tbody>
        </table>
      </div>
    </details>

    <p class="note">Fonte: classifiche annuali ufficiali dei singoli della FIMI ("Top of the Music", fimi.it), pubblicate già come classifiche dell'anno: non sono somme fatte da noi delle classifiche settimanali. La FIMI pubblica la classifica annuale dei singoli dal 2002; titoli, artisti e ordine sono quelli della fonte (riscritti in minuscolo dove la FIMI usa il tutto maiuscolo). Le copie vendute per singolo brano non sono pubbliche, quindi la lunghezza delle barre è una stima: dipende dalla posizione e da quanto era grande il mercato dei singoli in quell'anno (minimo nei primi anni 2000, di nuovo ampio con lo streaming). Il colore indica la provenienza dell'artista.</p>
  `;
}

ReactDOM.createRoot(document.getElementById("app")).render(html`<${App} />`);
</script>
